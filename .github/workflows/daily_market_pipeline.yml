name: 云端无头每日行情与研报自动化调度流水线 (Cloud Headless Daily Pipeline) [已停用自动触发]

# 【已停用云端自动运行】
# 依据买方投研数据安全规范与用户决策，全量金融计算与流水线均在本地电脑纯净运行。
# 彻底移除 schedule 定时轮询与自动触发，GitHub 仅作为代码和知识库备份存储库。

on:
  workflow_dispatch:
    inputs:
      market:
        description: '目标市场 (US / JP / ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - US
          - JP
