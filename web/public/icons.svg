<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 (深邃极地冰海) -->
    <radialGradient id="bullBgDef" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0a4b70" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#031826" />
    </radialGradient>

    <!-- 烈焰犄角主渐变 -->
    <linearGradient id="hornFlamePrimaryDef" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="25%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- 远侧犄角渐变 -->
    <linearGradient id="hornFlameSecondaryDef" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#b91c1c" />
      <stop offset="80%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 烈焰鬃毛渐变 -->
    <linearGradient id="maneFlameDef" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- 冰下地火暗核 -->
    <radialGradient id="heartCoreDef" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- 玄冰高光切面 -->
    <linearGradient id="iceHighlightDef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <symbol id="brand-logo" viewBox="0 0 64 64">
    <!-- 1. 玄冰外框徽章底座 -->
    <rect width="64" height="64" rx="16" fill="url(#bullBgDef)" stroke="#38bdf8" stroke-width="1.4" />
    <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#iceHighlightDef)" stroke-width="1" opacity="0.6" />

    <!-- 背景冰棱暗纹 -->
    <path d="M10 54 L20 40 L12 28 Z" fill="#0284c7" opacity="0.15" />
    <path d="M50 56 L58 42 L48 36 Z" fill="#38bdf8" opacity="0.1" />

    <!-- 2. 远侧犄角 -->
    <path d="M 26 23 C 28 14 34 9 46 7 C 40 12 34 18 31 25 Z" fill="url(#hornFlameSecondaryDef)" opacity="0.9" />

    <!-- 3. 烈焰鬃毛 -->
    <path d="M 24 28 C 18 20 12 22 7 27 C 12 26 18 28 22 32 Z" fill="url(#maneFlameDef)" />
    <path d="M 19 33 C 13 27 7 30 3 36 C 8 34 14 35 17 38 Z" fill="url(#maneFlameDef)" opacity="0.9" />
    <path d="M 14 39 C 9 35 5 38 2 44 C 6 41 10 42 13 44 Z" fill="url(#maneFlameDef)" opacity="0.75" />

    <!-- 4. 冰下地火暗核 -->
    <circle cx="24" cy="42" r="9" fill="url(#heartCoreDef)" />

    <!-- 5. 战牛身躯与肩颈 (玄冰切面甲胄) -->
    <polygon points="14,44 23,28 30,36 20,49" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8" stroke-linejoin="round" />
    <polygon points="20,49 30,36 36,46 25,56" fill="#0284c7" opacity="0.85" stroke="#7dd3fc" stroke-width="0.8" stroke-linejoin="round" />
    <polygon points="14,44 20,49 25,56 16,56" fill="#075985" stroke="#0284c7" stroke-width="0.6" stroke-linejoin="round" />

    <!-- 6. 近侧主犄角 -->
    <path d="M 33 27 C 36 17 44 10 56 6 C 49 14 42 22 38 31 C 35 30 33 28 33 27 Z" fill="url(#hornFlamePrimaryDef)" />
    <path d="M 34 27 C 38 18 45 12 56 6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
    <circle cx="56" cy="6" r="2.2" fill="#fef08a" />
    <circle cx="56" cy="6" r="1" fill="#ffffff" />

    <!-- 7. 牛首面部 (玄冰立体切割) -->
    <polygon points="28,26 37,29 36,36 26,32" fill="#38bdf8" stroke="#bae6fd" stroke-width="0.8" stroke-linejoin="round" />
    <polygon points="36,36 46,42 43,49 34,44" fill="#7dd3fc" stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round" />
    <polygon points="46,42 51,45 48,51 43,49" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8" stroke-linejoin="round" />
    <polygon points="34,44 43,49 39,55 31,48" fill="#0369a1" stroke="#0284c7" stroke-width="0.8" stroke-linejoin="round" />

    <!-- 8. 神牛极星之目 -->
    <polygon points="32,34 35,31 38,34 35,36" fill="#fef08a" />
    <polygon points="33.5,33.5 35,32 36.5,33.5 35,34.5" fill="#ffffff" />
    <circle cx="35" cy="33.5" r="0.8" fill="#dc2626" />

    <!-- 9. 鼻息微火暗流 -->
    <path d="M 49 49 C 52 50 54 53 53 55 C 51 54 50 52 48 50 Z" fill="#f59e0b" opacity="0.85" />
  </symbol>
</svg>
